id: ecomech:grouping003
name: Trophic Interactions
description: >
  Consumer-resource interactions that transfer energy and biomass between trophic
  levels, regulate population dynamics, and structure ecological communities.
  Herbivory, predation, detritivory, and trophic cascades together encompass the
  direct and indirect pathways by which organic matter moves through food webs
  and how apex consumers restructure ecosystem processes through top-down control.
members:
  - ECOCORE:00000020  # Herbivory
  - ECOCORE:00000102  # Predation
  - ECOCORE:00000057  # Detritivory
  - ECOCORE:00000205  # Trophic cascade
grouping_basis:
  - SHARED_MECHANISM
  - SHARED_OUTCOME
grouping_rationale: >
  Herbivory, predation, and detritivory involve the direct consumption of organic
  matter by heterotrophic animals, transferring energy up food chains or into
  the detrital pathway. Trophic cascades are the indirect ecosystem-level
  consequence of these interactions — the propagation of predator effects through
  food webs to alter plant biomass, carbon cycling, and community structure.
  Together these four processes define the consumer interaction space in
  ecological food web models and share top-down regulatory mechanisms governed
  by foraging theory and population dynamics frameworks.
creation_date: "2026-10-09T00:00:00Z"
