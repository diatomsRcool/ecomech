id: ECOCORE:00000198
name: Methane Cycling
process_term:
  id: ECOCORE:00000198
  label: methane cycling
description: >
  Methane cycling in wetland and aquatic ecosystems encompasses the production
  of methane (CH4) by methanogenic archaea (methanogenesis), its consumption by
  methanotrophic bacteria at oxic-anoxic interfaces (methanotrophy), and its
  emission to the atmosphere through
  diffusion, ebullition, and vascular plant transport. Wetlands are the single
  largest natural source of atmospheric CH4, contributing approximately 164
  Tg CH4 yr-1 — about one third of total global emissions. Net wetland CH4 flux
  is primarily controlled by soil temperature, water table depth, and vegetation
  type, with methanogenesis increasing steeply with temperature due to its
  unusually high activation energy (0.96 eV) relative to photosynthesis (0.3 eV)
  or aerobic respiration (0.65 eV). This temperature sensitivity means that
  global warming will disproportionately increase CH4 emissions relative to CO2
  from aquatic ecosystems, altering the ratio of CH4 to CO2 greenhouse gas
  emissions. Water table position governs the balance between methanogenesis
  in the anaerobic zone and methanotrophy in the aerobic zone, while vascular
  plant aerenchyma both delivers oxygen to suppress methanogenesis and provides
  a high-conductance pathway for CH4 transport directly to the atmosphere,
  bypassing methanotrophic oxidation.
synonyms:
  - wetland methane cycling
  - methanogenesis
  - CH4 biogeochemistry
  - methane flux dynamics
  - anaerobic carbon mineralization
ecological_scale: ECOSYSTEM

mechanisms:
  - name: Methanogenesis as Terminal Step in Anaerobic Carbon Mineralization
    description: >
      Methanogenesis is carried out by strictly anaerobic methanogenic archaea
      that consume hydrogen (H2/CO2 pathway) or acetate as substrates in the
      terminal step of organic matter mineralization under anaerobic conditions.
      Like other forms of microbial metabolism, methanogenesis is temperature-
      dependent, but its activation energy (0.96 eV) is substantially higher
      than aerobic respiration (~0.65 eV) and photosynthesis (~0.3 eV), predicting
      a 57-fold increase in methanogenesis between 0°C and 30°C. This steep
      temperature dependence propagates from pure methanogen cultures through
      anaerobic microbial communities to the ecosystem scale, where seasonal
      CH4 emissions show the same average temperature sensitivity — demonstrating
      that physiological temperature response of methanogens constrains
      ecosystem-scale CH4 flux across all wetland types.
    biological_processes:
      - term:
          id: GO:0055114
          label: oxidation-reduction process
        evidence:
          - reference: PMID:24670769
            supports: SUPPORT
            evidence_source: META_ANALYSIS
            snippet: "Methanogenesis is the terminal step in the remineralization of organic matter and is carried out by strictly anaerobic Archaea."
            explanation: >
              Yvon-Durocher et al. establish methanogenesis as the terminal
              anaerobic carbon mineralization step, carried out by archaeal
              anaerobes with thermodynamically constrained temperature responses;
              their meta-analysis demonstrates that this archaeal physiology
              scales from pure cultures to ecosystem CH4 flux with consistent
              activation energy (0.96 eV), establishing methanogenesis as
              the rate-limiting oxidation-reduction process in anaerobic wetland
              carbon cycling.
    taxa_involved:
      - taxon:
          id: NCBITaxon:2157
          label: Archaea
        role: DECOMPOSER
        description: >
          Strictly anaerobic methanogenic Archaea are the sole biological
          producers of CH4 in natural wetlands; their temperature-dependent
          metabolic rates determine the temperature sensitivity of ecosystem-scale
          CH4 emissions, and their obligate anaerobiosis means that water table
          position (controlling anaerobic zone depth) is the primary physical
          control on their activity and methane production.
    causal_edges:
      - subject: Anaerobic conditions in waterlogged soil
        predicate: ENABLES
        object: Methanogenic archaea completing organic matter mineralization to CH4
      - subject: Temperature increase in anaerobic soil zone
        predicate: CAUSES
        object: Exponential increase in methanogenesis rate and CH4 production
    evidence:
      - reference: PMID:24670769
        supports: SUPPORT
        evidence_source: META_ANALYSIS
        snippet: "Methanogenesis is the terminal step in the remineralization of organic matter and is carried out by strictly anaerobic Archaea."
        explanation: >
          Meta-analysis of seasonal CH4 emissions across diverse wetland types
          demonstrates consistent temperature sensitivity (0.96 eV) from microbial
          cultures to ecosystems; the much higher temperature sensitivity of
          methanogenesis relative to photosynthesis (0.3 eV) and respiration
          (0.65 eV) establishes that global warming will disproportionately
          increase CH4 emissions, altering the CH4:CO2 ratio in greenhouse
          gas emissions from wetlands.

  - name: Methanogenesis in Oxygenated Soils
    description: >
      The long-held paradigm that methanogenesis is restricted to anoxic habitats
      has been overturned by evidence that substantial CH4 production occurs in
      well-oxygenated surface soils of freshwater wetlands. In a freshwater
      wetland, oxygenated soils produced up to ten times more CH4 than anoxic
      soils, and up to 80% of total methane fluxes were attributed to
      methanogenesis in the oxygenated zone. Metagenomic and metatranscriptomic
      analysis identified a novel acetoclastic methanogen, Candidatus
      Methanothrix paradoxum, as the dominant organism responsible for oxic-zone
      methanogenesis. This organism is prevalent across methane-emitting
      ecosystems globally, suggesting that aerobic methanogenesis is a widespread
      phenomenon currently unaccounted for in biogeochemical models that restrict
      CH4 production to anoxic layers. Incorporation of oxic-zone methanogenesis
      is expected to substantially revise global wetland CH4 emission estimates
      upward.
    biological_processes:
      - term:
          id: GO:0055114
          label: oxidation-reduction process
        evidence:
          - reference: PMID:29146959
            supports: SUPPORT
            evidence_source: FIELD_STUDY
            snippet: "up to 80% of methane fluxes could be attributed to methanogenesis in oxygenated soils"
            explanation: >
              Angle et al. demonstrate with geochemical and metagenomic evidence
              that the majority of CH4 flux from a freshwater wetland originates
              from oxygenated surface soils rather than anoxic depths; the
              identification of Candidatus Methanothrix paradoxum as the key
              organism — and its global prevalence — establishes oxic-zone
              methanogenesis as a fundamentally important oxidation-reduction
              process that revises the conceptual model of where in the soil
              profile CH4 production occurs.
    taxa_involved:
      - taxon:
          id: NCBITaxon:2157
          label: Archaea
        role: DECOMPOSER
        description: >
          Candidatus Methanothrix paradoxum, a novel acetoclastic methanogenic
          archaeon, drives methanogenesis in oxygenated wetland surface soils;
          its prevalence across methane-emitting ecosystems indicates that
          oxygen-tolerant methanogens are globally significant contributors to
          wetland CH4 budgets.
    causal_edges:
      - subject: Acetoclastic methanogenesis by oxygen-tolerant archaea in surface soils
        predicate: CAUSES
        object: CH4 production in oxygenated soil layers contributing up to 80% of total wetland flux
      - subject: Oxygenated surface soil conditions
        predicate: ENABLES
        object: Activity of Candidatus Methanothrix paradoxum and aerobic-zone methanogenesis
    evidence:
      - reference: PMID:29146959
        supports: SUPPORT
        evidence_source: FIELD_STUDY
        snippet: "up to 80% of methane fluxes could be attributed to methanogenesis in oxygenated soils"
        explanation: >
          Field measurements paired with metagenomics and metatranscriptomics
          establish that oxygenated surface soils are the dominant source of CH4
          flux, not anoxic depth layers as assumed by current biogeochemical models;
          the finding that oxygenated soils produced up to ten times more CH4 than
          anoxic soils directly challenges the foundational assumption incorporated
          in Earth system models, with major ramifications for global CH4 estimates.

  - name: Anaerobic Oxidation of Methane in Wetland Soils
    description: >
      Anaerobic oxidation of methane (AOM) is a cryptic biogeochemical process
      in which CH4 is consumed in strictly anoxic soil zones, coupled to the
      reduction of terminal electron acceptors including sulfate, nitrate, and
      Fe/Mn oxides. AOM is carried out by anaerobic methanotrophic archaea
      (ANME), sometimes in syntrophy with sulfate-reducing bacteria, and
      potentially also by methanogens operating in reverse. AOM rates in
      terrestrial wetland soils span a wide range (1.4–704 nmol CH4 g-1 dry
      soil d-1), with electron acceptor availability as the primary control on
      which AOM pathway dominates. The widespread distribution of anaerobic
      methanotrophs across wetland types establishes AOM as a globally
      significant but poorly constrained sink within the wetland CH4 cycle —
      the "cryptic methane cycle" — that reduces net CH4 emissions below what
      would be predicted from methanogenesis rates alone.
    biological_processes:
      - term:
          id: GO:0055114
          label: oxidation-reduction process
        evidence:
          - reference: PMID:37543312
            supports: SUPPORT
            evidence_source: REVIEW
            snippet: "the availability of electron acceptors is critical in driving different AOM in wetland soils"
            explanation: >
              Zhao & Lu's synthesis of AOM in terrestrial wetlands establishes
              electron acceptor availability as the master control on which
              anaerobic methanotrophy pathway operates; the diversity of electron
              acceptors (sulfate, nitrate, Fe/Mn oxides) that can couple to AOM
              means that the redox environment of the soil profile determines
              both the rate and identity of the oxidation-reduction process
              responsible for CH4 consumption in anoxic wetland zones.
    taxa_involved:
      - taxon:
          id: NCBITaxon:2157
          label: Archaea
        role: DECOMPOSER
        description: >
          Anaerobic methanotrophic archaea (ANME groups) and potentially
          reverse-acting methanogens carry out AOM in anoxic wetland soils,
          consuming CH4 as an electron donor coupled to diverse electron
          acceptors; their widespread distribution across wetland types
          establishes them as globally significant agents of the cryptic
          wetland CH4 cycle.
    causal_edges:
      - subject: Electron acceptor availability in anoxic soil zones
        predicate: ENABLES
        object: Anaerobic oxidation of CH4 by methanotrophic archaea
      - subject: AOM consumption of CH4 in anoxic soil layers
        predicate: INHIBITS
        object: Net CH4 flux to the atmosphere from the soil profile
    evidence:
      - reference: PMID:37543312
        supports: SUPPORT
        evidence_source: REVIEW
        snippet: "the availability of electron acceptors is critical in driving different AOM in wetland soils"
        explanation: >
          Review of AOM rates across terrestrial wetlands (1.4–704 nmol CH4
          g-1 dry soil d-1) establishes the wide variability in this cryptic
          CH4 sink and identifies electron acceptor availability as its primary
          driver; the prevalence of anaerobic methanotrophs across wetland
          ecosystems confirms that AOM is a globally distributed process that
          offsets methanogenesis in anoxic soil zones, with implications for
          net CH4 flux predictions from wetland biogeochemical models.

  - name: Water Table and Temperature as Dominant Controls on Wetland CH4 Flux
    description: >
      Net CH4 flux from wetlands is primarily governed by the interaction between
      water table position, which determines the depth and extent of the anaerobic
      methanogenic zone, and temperature, which controls the rate of methanogenesis.
      The optimal water table depth for maximum CH4 flux differs among wetland
      types: in bogs, maximum flux occurs when dry antecedent conditions are
      followed by wet conditions; in fens and swamps, maximum flux occurs
      under sustained wet conditions both 30-day antecedent and current. Fen
      methane flux is more sensitive to vegetation and less sensitive to temperature
      than bog or swamp flux, demonstrating that vascular plant community composition
      modifies the dominant physical controls on CH4 emissions. Drained wetlands
      show distinctly different CH4–environment relationships from pristine wetlands,
      confirming that the water table–CH4 relationship is not transferable across
      hydrological states.
    biological_processes:
      - term:
          id: GO:0055114
          label: oxidation-reduction process
        evidence:
          - reference: PMID:24777536
            supports: SUPPORT
            evidence_source: FIELD_STUDY
            snippet: "water table and temperature are dominant controls on methane flux in pristine bogs and swamps"
            explanation: >
              Turetsky et al.'s synthesis of ~19,000 instantaneous CH4 measurements
              across 71 wetlands confirms that water table depth and temperature
              are the dominant environmental controls on CH4 flux in bogs and
              swamps; the finding that these relationships are modified by wetland
              type (bog vs. fen vs. swamp) and region establishes the mechanistic
              basis for type-specific controls on the redox-driven methanogenesis-
              methanotrophy balance that determines net CH4 flux.
    causal_edges:
      - subject: High water table saturating soil profile
        predicate: ENABLES
        object: Deep anaerobic methanogenic zone and elevated CH4 production
      - subject: Water table drawdown expanding aerobic zone
        predicate: INHIBITS
        object: Net CH4 flux by constraining anaerobic methanogenesis and promoting methanotrophic oxidation
    evidence:
      - reference: PMID:24777536
        supports: SUPPORT
        evidence_source: FIELD_STUDY
        snippet: "water table and temperature are dominant controls on methane flux in pristine bogs and swamps"
        explanation: >
          Synthesis of 71 global wetland sites demonstrates that water table
          and temperature together explain most of the variation in CH4 flux
          in pristine bogs and swamps; the contrasting optimal water table
          positions for different wetland types (below peat surface in bogs,
          near surface in poor fens, above surface in rich fens) reveals that
          the physical control of water table on CH4 flux is mediated by
          vegetation-specific aerenchyma transport pathways that differ in
          conductance and methanotrophy exposure.

  - name: Wetland Heterogeneity in Global CH4 Emissions
    description: >
      Wetlands are the largest single natural source of atmospheric CH4, but
      emission rates are highly heterogeneous among and within wetland types,
      regions, and disturbance states. Fen CH4 flux differs mechanistically
      from bog or swamp flux in its greater sensitivity to vegetation (vascular
      plant transport) and lower sensitivity to temperature. Drained wetlands
      exhibit characteristic loss of the large CH4 flux events that occur
      under warm-wet conditions in pristine wetlands, demonstrating that
      disturbance fundamentally alters the CH4–environment relationship.
      Global and regional CH4 emission estimates carry large uncertainties
      from spatial heterogeneity of wetlands, inadequate wetland mapping,
      and the limited number of observational sites relative to the diversity
      of wetland types and climate regions.
    biological_processes:
      - term:
          id: GO:0055114
          label: oxidation-reduction process
        evidence:
          - reference: PMID:23505021
            supports: SUPPORT
            evidence_source: REVIEW
            snippet: "Wetlands are the single largest natural CH4 source with median emissions from published studies of 164 Tg yr(-1), which is about a third of total global emissions."
            explanation: >
              Bridgham et al. synthesize global wetland CH4 emission estimates
              (164 Tg yr-1 median), establishing wetlands as the dominant natural
              CH4 source; the review identifies major uncertainties from poorly
              constrained controls (substrate supply, microbial community
              composition, vascular transport) and spatial extrapolation errors
              from heterogeneous wetland complexes, highlighting the gap between
              current understanding of methanogenesis-methanotrophy oxidation-
              reduction processes and their reliable global quantification.
    causal_edges:
      - subject: Wetland type and vegetation composition
        predicate: MODULATES
        object: Relative sensitivity of CH4 flux to temperature vs. water table vs. vascular transport
      - subject: Wetland drainage altering water table and aerobic zone
        predicate: INHIBITS
        object: Warm-wet CH4 emission pulses characteristic of pristine wetland dynamics
    evidence:
      - reference: PMID:23505021
        supports: SUPPORT
        evidence_source: REVIEW
        snippet: "Wetlands are the single largest natural CH4 source with median emissions from published studies of 164 Tg yr(-1), which is about a third of total global emissions."
        explanation: >
          Global synthesis establishes the quantitative primacy of wetlands in
          the natural CH4 budget; the identification of inadequately constrained
          controls (substrate supply, microbial community composition, spatial
          heterogeneity) as major sources of emission uncertainty frames the
          current frontier of wetland CH4 research and the mechanisms most
          needed for improved global CH4 cycling predictions.

indicators:
  - name: Net CH4 flux from wetland surfaces
    description: >
      Net CH4 flux to the atmosphere (mg CH4 m-2 d-1) measured by static
      chambers, eddy covariance towers, or automated chamber systems is the
      primary indicator of methane cycling intensity. Flux measurements integrate
      methanogenesis, methanotrophy, and transport by diffusion, ebullition, and
      vascular plants. Flux partitioned by season and stratified by water table
      depth and temperature identifies the dominant environmental controls on
      methane cycling at a given site.
    indicator_term:
      id: PATO:0000070
      label: concentration
    measurement: "CH4 flux (mg CH4 m-2 d-1) from static chambers or eddy covariance; partitioned by season and stratified by water table depth class"
    frequency: COMMON
    temporality: CHRONIC
    evidence:
      - reference: PMID:24777536
        supports: SUPPORT
        evidence_source: FIELD_STUDY
        snippet: "water table and temperature are dominant controls on methane flux in pristine bogs and swamps"
        explanation: >
          Synthesis of ~19,000 instantaneous flux measurements across 71 wetlands
          validates CH4 flux measurement as the primary indicator of methane cycling,
          with clear responses to water table and temperature; the demonstration
          that flux-environment relationships differ between pristine and drained
          wetlands underscores the importance of site hydrological state as context
          for interpreting flux indicators.

  - name: Pore water CH4 concentration profile
    description: >
      Dissolved CH4 concentration in soil pore water at multiple depths indicates
      the depth and intensity of the methanogenic zone and diffusive CH4 flux
      gradients. High pore water CH4 at depth with a steep gradient toward the
      surface indicates active methanogenesis below the water table and diffusive
      transport to the atmosphere; the profile shape also indicates whether
      methanotrophic consumption at the oxic-anoxic interface is significant.
    indicator_term:
      id: PATO:0000070
      label: concentration
    measurement: "Dissolved CH4 (μmol L-1) in pore water at 5, 10, 20, 40 cm depth from Rhizon samplers or push-tube samples"
    frequency: COMMON
    temporality: CHRONIC
    evidence:
      - reference: PMID:24670769
        supports: SUPPORT
        evidence_source: META_ANALYSIS
        snippet: "Methanogenesis is the terminal step in the remineralization of organic matter and is carried out by strictly anaerobic Archaea."
        explanation: >
          The anaerobic archaeal basis of methanogenesis established by
          Yvon-Durocher et al. implies that pore water CH4 concentration
          in the anaerobic zone directly reflects methanogen activity rate;
          pore water CH4 profiles trace the spatial extent of the methanogenic
          zone and provide mechanistic context for interpreting surface flux
          measurements in terms of production vs. oxidative consumption.

drivers:
  - name: Soil temperature
    description: >
      Soil temperature in the anaerobic zone is a primary driver of methanogenesis
      rate, with an unusually high activation energy (0.96 eV) that translates to
      a 57-fold increase in methanogenesis between 0°C and 30°C. This high
      temperature sensitivity is consistent across microbial cultures, anaerobic
      communities, and ecosystem-scale seasonal CH4 emissions. Under global warming,
      temperature increases in northern peatlands will drive disproportionate
      increases in CH4 emissions relative to CO2, altering the greenhouse gas
      balance of boreal and arctic wetlands.
    driver_type: CLIMATE
    evidence:
      - reference: PMID:24670769
        supports: SUPPORT
        evidence_source: META_ANALYSIS
        snippet: "Methanogenesis is the terminal step in the remineralization of organic matter and is carried out by strictly anaerobic Archaea."
        explanation: >
          Yvon-Durocher et al. document that the 0.96 eV activation energy of
          methanogenesis — measured consistently from archaea to ecosystems —
          substantially exceeds that of photosynthesis and respiration; because
          CH4 emissions increase with temperature at twice the rate of CO2 from
          respiration, warming is a disproportionate driver of CH4 emission
          intensity relative to carbon inputs, establishing temperature as a
          critical climate driver of wetland CH4 cycling feedback.

  - name: Water table depth
    description: >
      Water table position determines the depth and spatial extent of the anaerobic
      methanogenic zone; high water tables that saturate most of the soil profile
      maximize methanogenic zone volume and minimize methanotrophic oxidation by
      reducing the depth of the aerobic zone. In bogs, the largest CH4 flux
      events occur when dry antecedent conditions (compressed peat, limited
      methanogenesis) are followed by rewetting; in fens and swamps, sustained
      wet conditions maximize flux. Drought-induced water table drawdown reduces
      CH4 emissions by expanding the aerobic methanotrophic zone.
    driver_type: ABIOTIC
    evidence:
      - reference: PMID:24777536
        supports: SUPPORT
        evidence_source: FIELD_STUDY
        snippet: "water table and temperature are dominant controls on methane flux in pristine bogs and swamps"
        explanation: >
          Synthesis of 71 wetland sites across subtropical to subarctic climates
          establishes water table depth as a dominant physical driver of CH4 flux;
          type-specific optimal water table positions (below peat in bogs vs. above
          peat in rich fens) demonstrate that water table control on CH4 flux
          is mediated through its effects on anaerobic zone extent and vegetation-
          mediated gas transport, confirming water table as the primary hydrological
          driver of methane cycling intensity.

  - name: Vegetation type and vascular plant community
    description: >
      Vascular plant communities with aerenchyma tissue (sedges, reeds, rice,
      wetland emergents) simultaneously supply oxygen to root zones (locally
      suppressing methanogenesis) and provide high-conductance pathways for CH4
      transport directly from rhizospheric production sites to the atmosphere,
      bypassing methanotrophic oxidation. Fen CH4 flux shows greater sensitivity
      to vegetation than bog or swamp flux, demonstrating that vascular plant
      transport can override temperature and water table controls in some wetland
      types.
    driver_type: BIOTIC
    evidence:
      - reference: PMID:24777536
        supports: SUPPORT
        evidence_source: FIELD_STUDY
        snippet: "water table and temperature are dominant controls on methane flux in pristine bogs and swamps"
        explanation: >
          Turetsky et al. demonstrate that fen CH4 flux is more sensitive to
          vegetation than to temperature — contrasting with bogs and swamps where
          water table and temperature dominate — establishing that vascular plant
          community composition is a biotic driver that can override the primary
          abiotic controls on methane cycling in vegetation-mediated wetland types;
          this driver is particularly significant for rice paddy and freshwater
          fen systems where aerenchyma transport dominates CH4 emission pathways.

interventions:
  - name: Wetland rewetting to restore CH4 cycling and carbon balance
    description: >
      Rewetting of drained peatlands by blocking drainage ditches and raising
      water tables restores anaerobic conditions that support methanogenesis
      and enable carbon accumulation. While rewetting initially increases CH4
      emissions, the restored carbon sequestration in accumulating peat typically
      offsets the increased CH4 greenhouse gas forcing on decadal timescales.
      Rewetting is the primary intervention for restoring carbon and greenhouse
      gas balance of degraded peatland ecosystems.
    intervention_type: RESTORATION
    evidence:
      - reference: PMID:24777536
        supports: SUPPORT
        evidence_source: FIELD_STUDY
        snippet: "water table and temperature are dominant controls on methane flux in pristine bogs and swamps"
        explanation: >
          The established dominant role of water table in controlling CH4 flux
          in bogs and swamps, and the demonstrated distinct behavior of drained
          vs. pristine wetlands, provides the mechanistic basis for rewetting
          interventions; raising water tables in drained peatlands restores the
          water table-CH4 flux relationship characteristic of pristine wetlands,
          which is the hydrological precondition for restored peatland carbon
          accumulation and methane cycling function.

  - name: Managed water table drawdown to reduce CH4 emissions
    description: >
      Strategic water table drawdown in managed wetlands (rice paddies, treatment
      wetlands, constructed peatlands) during periods of high CH4 production can
      reduce net emissions by expanding the aerobic methanotrophic zone and
      temporarily oxidizing CH4 produced during high-water phases. Mid-season
      drainage in rice paddies is a widely implemented agronomic practice that
      reduces CH4 emissions while maintaining grain yields.
    intervention_type: MANAGEMENT
    evidence:
      - reference: PMID:24777536
        supports: SUPPORT
        evidence_source: FIELD_STUDY
        snippet: "water table and temperature are dominant controls on methane flux in pristine bogs and swamps"
        explanation: >
          The mechanistic relationship between water table depth and CH4 flux
          established across 71 wetlands provides the quantitative basis for
          managed drawdown to reduce CH4 emissions; the distinctive behavior
          of drained vs. pristine wetlands (absence of large warm-wet flux
          events in drained systems) demonstrates that water table management
          can substantially alter CH4 emission dynamics without eliminating
          the wetland ecosystem.

habitat_context:
  - habitat_term:
      id: ENVO:00000043
      label: wetland
    description: >
      Methane cycling is most intense in permanently or seasonally waterlogged
      wetland ecosystems including bogs, fens, marshes, swamps, rice paddies,
      and floodplain wetlands; aquatic sediments of lakes, rivers, and coastal
      areas also support significant methanogenesis and contribute to global
      CH4 budgets through ebullition and diffusion.

