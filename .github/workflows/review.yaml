# Automatically review pull requests that touch kb/processes/ entries.
#
# Security model:
#   - Default branch is checked out to `.`  (trusted: schema, tools, prompts)
#   - PR files are sparse-checked out to `pr/`  (untrusted: data only)
#   - Agent runs tools from `.` against files in `pr/`
#   - Agent has no write access to the repository; a separate publish job
#     posts the review comment.
#
# Prerequisites: ANTHROPIC_API_KEY repository secret.

name: Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - "kb/processes/**"
      - "kb/modules/**"
      - "kb/groupings/**"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

jobs:
  review:
    # Skip fork PRs (they cannot use secrets safely) and Dependabot
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      pull-requests: read

    outputs:
      has_output: ${{ steps.check.outputs.has_output }}

    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            sha=$(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} --jq '.head.sha')
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            # issue_comment — extract PR number from the issue URL
            pr_num=$(gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }} --jq '.pull_request.url | split("/") | last')
            echo "number=$pr_num" >> "$GITHUB_OUTPUT"
            sha=$(gh api repos/${{ github.repository }}/pulls/$pr_num --jq '.head.sha')
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Check out default branch — tools, schema, prompts (trusted)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # Sparse-checkout PR data files only (untrusted content)
      - name: Checkout PR files
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          sparse-checkout: |
            kb/
            references_cache/
          sparse-checkout-cone-mode: false

      - id: agent
        uses: ./.github/actions/setup-agent
        with:
          workflow: review

      - name: Build prompt
        id: prompt
        env:
          PROMPT_PR_NUMBER: ${{ steps.pr.outputs.number }}
          PROMPT_REPO: ${{ github.repository }}
        run: python .github/scripts/render_prompt.py review >> "$GITHUB_OUTPUT"

      - id: run
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ steps.agent.outputs.executable }}
          direct_prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: |
            --model ${{ steps.agent.outputs.model }}
            --max-turns ${{ steps.agent.outputs.max-turns }}
            --allowedTools "Bash(just validate:*),Bash(just validate-terms-file:*),Bash(just validate-references:*),Bash(just fetch-reference:*),Bash(ls:*),Bash(git diff:*),Read,Glob,Grep,Write"

      - name: Check agent run
        if: always() && steps.agent.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
        run: python .github/scripts/check_agent_run.py "$EXECUTION_FILE" "Review"

      - name: Check output exists
        id: check
        run: |
          if [ -f review_output.json ]; then
            echo "has_output=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_output=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload review output
        if: steps.check.outputs.has_output == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-output-${{ steps.pr.outputs.number }}
          path: review_output.json
          retention-days: 7

  publish:
    needs: review
    if: needs.review.outputs.has_output == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            pr_num=$(gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }} --jq '.pull_request.url | split("/") | last')
            echo "number=$pr_num" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download review output
        uses: actions/download-artifact@v4
        with:
          name: review-output-${{ steps.pr.outputs.number }}

      - name: Post review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { publish } = require('./.github/scripts/review-publish.js');
            const result = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            await publish(
              github,
              context.repo.owner + '/' + context.repo.repo,
              parseInt('${{ steps.pr.outputs.number }}'),
              result,
            );
