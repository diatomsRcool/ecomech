# Respond to @claude mentions in issues, pull requests, and reviews.
#
# Claude reads CLAUDE.md and the skills in the checkout and can branch,
# commit, and open pull requests.
#
# Prerequisites:
#   1. Install the Claude GitHub App on this repository:
#      https://github.com/apps/claude
#   2. Add ANTHROPIC_API_KEY (preferred) or CLAUDE_CODE_OAUTH_TOKEN as a
#      repository secret.
#   3. Optionally add EOL_API_TOKEN for TraitBank lookups in the /curate skill.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Concurrency is scoped to the issue/PR so comments don't race, but a
    # skipped job (no @claude mention) never joins the group and cannot cancel
    # a queued @claude run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    # Security boundary: only owners, members, and collaborators may summon
    # the agent.
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Optional keys for TraitBank (EOL) and GBIF lookups used by /curate
      EOL_API_TOKEN: ${{ secrets.EOL_API_TOKEN }}
      GBIF_API_TOKEN: ${{ secrets.GBIF_API_TOKEN }}
      # Deep-research providers (unset secrets are empty strings)
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: agent
        uses: ./.github/actions/setup-agent
        with:
          workflow: claude

      - id: run
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          path_to_claude_code_executable: ${{ steps.agent.outputs.executable }}
          use_sticky_comment: true
          track_progress: true
          claude_args: |
            --model ${{ steps.agent.outputs.model }}
            --max-turns ${{ steps.agent.outputs.max-turns }}
            --allowedTools "Bash(just:*),Bash(uv run:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh search:*),Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,TodoWrite,Task"

      - name: Check agent run
        if: always() && steps.agent.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.run.outputs.execution_file }}
        run: python .github/scripts/check_agent_run.py "$EXECUTION_FILE" "Claude"
